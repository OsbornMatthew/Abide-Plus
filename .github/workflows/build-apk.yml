name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
      ORG_GRADLE_PROJECT_android.useAndroidX: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set Permissions on gradlew and Hermes
        run: |
          chmod +x android/gradlew
          find node_modules/react-native/sdks/hermesc/ -type f -exec chmod +x {} + 2>/dev/null || true
          chmod -R 777 node_modules/react-native/sdks/hermesc/ || true

      - name: Compile Standalone Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" -not -name "*unaligned*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file generated in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./Abide-Plus.apk

      - name: Verify APK Generated
        run: |
          if [ ! -f "./Abide-Plus.apk" ]; then
            echo "::error::Abide-Plus.apk was not generated"
            exit 1
          fi
          ls -lh ./Abide-Plus.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Plus-Android-APK
          path: ./Abide-Plus.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ./Abide-Plus.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Abide+ Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Abide+ Android App Download

            🎉 **Abide+ Standalone Android APK is ready to install!**

            Download `Abide-Plus.apk` below and install it directly on your Android phone.

            ### ✨ Features Included:
            - 🔥 1000 Praises (1000 ஸ்தோத்திர பலிகள்) with Fast Search & Number Filtering
            - 🎡 Spiritual Decision Maker Wheel with Custom & Editable Wheels
            - 📖 Scripture Reader & Daily Verse of the Day with Tamil & English translations
            - 🕊️ A.C.T.S Prayer War Room & Persistent Devotional Timer
            - 💰 Financial Pulse, 10% Storehouse Tithes, Savings & Transaction Management
            - 🎯 Daily Spiritual Habits & To-Do Planner
            - 🛡️ Safe Account Details & 1-Click JSON Backup/Restore
            - 🌓 Sleek Glassmorphism UI with Dark & Light themes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
