name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: 📱 Build Standalone Android APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
      ORG_GRADLE_PROJECT_android.useAndroidX: "true"

    steps:
      - name: 🚀 Configure 10GB Swap Space (Prevent Compiler OOM)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📜 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n79124426920f4f141a5e5b1e3709c4ab840be6b0\n8564b017a0fdac303a342ab0b1ff118e8d3d86a1\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔑 Set Permissions on Gradle & Hermes
        run: |
          chmod +x android/gradlew
          chmod -R 777 node_modules/react-native/sdks/hermesc/ || true

      - name: 🚀 Compile Standalone Android APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2 -x lint --stacktrace || ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2 -x lint --stacktrace
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file generated in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./Abide-Plus.apk

      - name: 🔍 Verify Standalone APK
        id: verify-apk
        run: |
          if [ ! -f "./Abide-Plus.apk" ]; then
            echo "::error::Abide-Plus.apk was not generated"
            exit 1
          fi
          ls -lh ./Abide-Plus.apk
          echo "apk_path=./Abide-Plus.apk" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Plus-Android-APK
          path: ./Abide-Plus.apk
          retention-days: 30

      - name: 🌟 Publish GitHub Release with APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ./Abide-Plus.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Abide+ Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Abide+ Android App Download

            🎉 **Abide+ Standalone Android APK is ready to install!**

            Download `Abide-Plus.apk` below and install it directly on your Android phone.

            ### ✨ Features Included:
            - 🔥 1000 Praises (1000 ஸ்தோத்திர பலிகள்) with Fast Search & Number Filtering
            - 🎡 Spiritual Decision Maker Wheel with Custom & Editable Wheels
            - 📖 Scripture Reader & Daily Verse of the Day with Tamil & English translations
            - 🕊️ A.C.T.S Prayer War Room & Persistent Devotional Timer
            - 💰 Financial Pulse, 10% Storehouse Tithes, Savings & Transaction Management
            - 🎯 Daily Spiritual Habits & To-Do Planner
            - 🛡️ Safe Account Details & 1-Click JSON Backup/Restore
            - 🌓 Sleek Glassmorphism UI with Dark & Light themes
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
