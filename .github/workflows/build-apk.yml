name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      ORG_GRADLE_PROJECT_android.useAndroidX: "true"
      ORG_GRADLE_PROJECT_android.enableJetifier: "true"

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📜 Accept Android SDK & NDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses || true
            fi
          fi

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: ⚙️ Enforce CI Optimized Gradle Properties
        run: |
          echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "newArchEnabled=false" >> android/gradle.properties

      - name: 🔑 Set Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Compile Standalone Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --stacktrace

      - name: 🔍 Locate Generated APK
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Plus-Android-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: 🌟 Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.apk_path }}
          tag_name: v1.0.${{ github.run_number }}
          name: "Abide+ Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Abide+ Android App Download

            🎉 Your Android APK is ready! Download and install `app-debug.apk` directly on your Android phone.

            ### ✨ What's Included:
            - 📖 Scripture Reader & Note Creator with Chapter Tracker
            - 🕊️ A.C.T.S Prayer War Room with Realtime Praise Wall
            - 💰 Monthly Expenses, 10% Storehouse Tithes, Savings & Auto Balance Carryover
            - 🎯 Everyday Disciplines (Read Bible Today & Prayer Today)
            - 🌓 Refined Light & Dark Themes with Soft Drop Shadows
            - 🔄 Seamless Realtime Cross-Device Sync (Firebase Firestore)
            - 🔒 Google & Email/Password Authentication Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
