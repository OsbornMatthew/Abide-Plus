name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Standalone Android APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      ORG_GRADLE_PROJECT_android.useAndroidX: "true"
      ORG_GRADLE_PROJECT_android.enableJetifier: "true"
      EAS_NO_VCS: "1"

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📜 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n79124426920f4f141a5e5b1e3709c4ab840be6b0\n8564b017a0fdac303a342ab0b1ff118e8d3d86a1" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: 📦 Install Node Modules
        run: npm install --legacy-peer-deps

      - name: 🔑 Set Permissions for Gradlew
        run: chmod +x android/gradlew || true

      - name: 🚀 Build Standalone Android APK (EAS Local / Gradle)
        run: |
          npm install -g eas-cli
          if eas build --platform android --profile preview --local --non-interactive --output=./Abide-Plus.apk; then
            echo "EAS local build succeeded!"
          else
            echo "EAS build fallback to direct Gradle compilation..."
            cd android
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --stacktrace || ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --stacktrace
            cd ..
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" ./Abide-Plus.apk
          fi

      - name: 🔍 Verify APK File
        id: verify-apk
        run: |
          if [ ! -f "./Abide-Plus.apk" ]; then
            APK_FALLBACK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FALLBACK" ]; then
              cp "$APK_FALLBACK" ./Abide-Plus.apk
            else
              echo "::error::Abide-Plus.apk was not generated"
              exit 1
            fi
          fi
          echo "Verified APK at: ./Abide-Plus.apk"
          echo "apk_path=./Abide-Plus.apk" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Plus-Android-APK
          path: ./Abide-Plus.apk
          retention-days: 30

      - name: 🌟 Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ./Abide-Plus.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Abide+ Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Abide+ Android App Download

            🎉 Your Android APK is ready! Download and install `Abide-Plus.apk` directly on your Android phone.

            ### ✨ Features Included:
            - 📖 Scripture Reader & Note Creator with Chapter Tracker
            - 🕊️ A.C.T.S Prayer War Room with Realtime Praise Wall
            - 💰 Monthly Expenses, 10% Storehouse Tithes, Savings & Auto Balance Carryover
            - 🎯 Everyday Disciplines (Read Bible Today & Prayer Today)
            - 🌓 Refined Light & Dark Themes with Soft Drop Shadows
            - 🔄 Seamless Realtime Cross-Device Sync (Firebase Firestore)
            - 🔒 Google & Email/Password Authentication Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
