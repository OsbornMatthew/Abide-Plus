name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Generate Android Native Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 Locate Generated APK
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Plus-Android-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: 🌟 Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.apk_path }}
          tag_name: v1.0.${{ github.run_number }}
          name: "Abide+ Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Abide+ Android App Download

            🎉 Your Android APK is ready! Download and install `app-debug.apk` directly on your Android phone.

            ### ✨ Included Features:
            - 📖 Scripture Reader & Note Creator with Chapter Tracker
            - 🕊️ A.C.T.S Prayer War Room & Praise Wall
            - 💰 Monthly Expenses, 10% Storehouse Tithes, Savings & Auto Balance Carryover
            - 🎯 Everyday Disciplines (Read Bible Today & Prayer Today)
            - 🌓 Refined Light & Dark Themes with Soft Drop Shadows
            - 🔒 Secure Google & Email/Password Authentication Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
